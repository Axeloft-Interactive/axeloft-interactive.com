  <div id="sandbox-ui" class="sandbox-controls">
    <div class="controls-header" id="sandbox-ui-header" style="cursor: move;">
      <h2 style="pointer-events:none">Sandbox</h2>
      <div style="display:flex; gap:0.2rem;">
        <button id="reset-btn" class="btn-secondary small">Rst</button>
        <button id="close-sandbox-btn" class="btn-secondary small" title="Close">✕</button>
      </div>
    </div>

    <div class="control-group">
      <div class="tools-row">
        <button class="color-btn active" data-color="#ff007f" style="background:#ff007f" title="Pink"></button>
        <button class="color-btn" data-color="#00f0ff" style="background:#00f0ff" title="Cyan"></button>
        <button class="color-btn" data-color="#ffb700" style="background:#ffb700" title="Amber"></button>
        <button class="color-btn rainbow-btn" data-color="rainbow" title="Rainbow (matches logo)">🌈</button>
      </div>
      <div class="slider-container" style="position: relative; width: 100%; height: 20px; display: flex; align-items: center;">
        <input type="range" id="brush-size" value="1" min="1" max="3" style="width: 100%; margin: 0;">
        <span id="size-val" style="position: absolute; top: 50%; left: 10px; transform: translate(-50%, -50%); pointer-events: none; font-size: 0.65rem; font-weight: bold; color: #000;">1</span>
      </div>
    </div>

    <div class="control-group">
      <input type="text" id="sandbox-text" value="Axeloft Interactive" class="text-input" placeholder="Enter text">
    </div>
  </div>
